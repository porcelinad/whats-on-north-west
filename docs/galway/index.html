<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1E2B26">
<title>Out and About Galway</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="../outandabout_logo.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

<style>
  :root{
    --mist:#ECEFE9;
    --ink:#1E2B26;
    --ink-soft:#8b978f; /* Lightened for readability on dark background */
    --ember:#B8481C;
    --heather:#6F5B92;
    --line:#34413b; /* Darkened to blend with dark background */
    --stub:#FFFFFF;

    --display:"Barlow Condensed",sans-serif;
    --body:"Atkinson Hyperlegible",system-ui,sans-serif;
  }

  *{
    box-sizing:border-box;
    margin:0;
  }

  body{
    background:var(--ink); /* Flipped to dark */
    color:var(--mist); /* Flipped to light */
    font-family:var(--body);
    font-size:16px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }

  a{
    color:inherit;
  }

  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:0 14px 80px;
  }

  header{
    padding:22px 0 10px;
    border-bottom:3px solid var(--line);
  }

  h1{
    font-family:var(--display);
    font-weight:700;
    font-size:clamp(28px,8vw,48px);
    text-transform:uppercase;
    line-height:.95;
    letter-spacing:.02em;
    color: var(--mist);
  }

  h1 .black-bg{
    background-color: #000;
    display: block;
    width: 100%;
    padding: 0.2em 0.3em;
    margin-bottom: 6px;
  }

  h1 .rust {
    color:var(--ember);
  }

  h1 .region{
    display:block;
    font-size:.62em;
    margin-top:4px;
  }

  .updated{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:6px;
  }

  .controls{
    position:sticky;
    top:0;
    background:var(--ink); /* Flipped to match dark background */
    z-index:5;
    padding:10px 0 12px;
  }
</style>
</head>

<body>

<div class="wrap">

  <header>
    <h1>
      <span class="black-bg">Out <span class="rust">and ab</span>out</span>
      <span class="region rust">Galway</span>
    </h1>
    <p class="updated" id="updated">Loading…</p>
  </header>

  <div class="controls">

    <div class="filters">
      <select id="countyFilter"
              class="filter-select"
              aria-label="Filter by county"></select>

      <select id="locationFilter"
              class="filter-select"
              aria-label="Filter by location"></select>

      <select id="genreFilter"
              class="filter-select"
              aria-label="Filter by genre"></select>
    </div>

    <div class="search-row">
      <input
        id="search"
        type="search"
        placeholder="Search by event, venue or genre…"
        aria-label="Search by event, venue or genre">

      <button
        id="clearFilters"
        class="clear-btn"
        type="button">
        Clear all filters
      </button>
    </div>

    <div
      class="date-filters"
      id="dateFilters"
      role="group"
      aria-label="Filter by date"></div>

    <div
      class="custom-dates"
      id="customDates"
      hidden>

      <input
        type="date"
        id="dateFrom"
        aria-label="From date">

      <input
        type="date"
        id="dateTo"
        aria-label="To date">
    </div>

    <p
      class="date-error"
      id="dateError"
      hidden></p>

    <div
      class="extra-filters"
      id="shapeFilters"
      role="group"
      aria-label="Filter by recurrence"></div>

  </div>

  <main id="list"></main>

  <footer>
    Pulled daily from each venue's own website. Tap an event for details
    and booking on the venue's site.
  </footer>

</div>

<script>

const MONTHS=[
  "January","February","March","April","May","June",
  "July","August","September","October","November","December"
];

const DOWS=[
  "Sun","Mon","Tue","Wed","Thu","Fri","Sat"
];

let EVENTS=[];
let countySel="All";
let genreSel="All";
let locationSel="All";
let query="";
let dateSel=null;
let customFrom="";
let customTo="";
let shapeSel=null;


function normalizeTown(t){
  return t==="Donegal" ? "Donegal Town" : t;
}


function locationLabel(ev){
  return ev.town
    ? normalizeTown(ev.town)
    : (ev.county ? "No town listed" : null);
}


function addDays(iso,n){
  const [y,m,d]=iso.split("-").map(Number);
  return new Date(
    Date.UTC(y,m-1,d+n)
  ).toISOString().slice(0,10);
}


function weekdayOf(iso){
  const [y,m,d]=iso.split("-").map(Number);
  return new Date(
    Date.UTC(y,m-1,d)
  ).getUTCDay();
}


function todayISO(){
  const parts=new Intl.DateTimeFormat(
    "en-CA",
    {
      timeZone:"Europe/Dublin",
      year:"numeric",
      month:"2-digit",
      day:"2-digit"
    }
  ).formatToParts(new Date());

  const get=t=>parts.find(
    p=>p.type===t
  ).value;

  return `${get("year")}-${get("month")}-${get("day")}`;
}


function weekendRange(today){
  const wd=weekdayOf(today);

  if(wd===6){
    return {
      from:today,
      to:addDays(today,1)
    };
  }

  if(wd===0){
    return {
      from:today,
      to:today
    };
  }

  const sat=addDays(today,6-wd);

  return {
    from:sat,
    to:addDays(sat,1)
  };
}


const TODAY_ISO=todayISO();
const TOMORROW_ISO=addDays(TODAY_ISO,1);


const el=(t,c,txt)=>{
  const n=document.createElement(t);

  if(c){
    n.className=c;
  }

  if(txt!==undefined){
    n.textContent=txt;
  }

  return n;
};


function fmt(iso){
  const d=new Date(iso+"T12:00:00");

  return {
    dow:DOWS[d.getDay()],
    day:d.getDate(),
    mon:MONTHS[d.getMonth()].slice(0,3),
    month:MONTHS[d.getMonth()],
    key:iso.slice(0,7)
  };
}


function isNew(ev,gen){
  const first=new Date(ev.first_seen);
  const g=new Date(gen);

  return (g-first)/86400000 <= 7;
}


function fmtUpdated(iso){
  try{
    const d=new Date(iso);

    if(isNaN(d)){
      return iso;
    }

    return d.toLocaleString(
      "en-IE",
      {
        day:"numeric",
        month:"short",
        hour:"2-digit",
        minute:"2-digit",
        timeZone:"Europe/Dublin"
      }
    );

  }catch(e){
    return iso;
  }
}


function matchesShape(ev){

  if(shapeSel==="single"){
    return !ev.end_date;
  }

  if(shapeSel==="recurring"){
    return !!ev.end_date;
  }

  return true;
}


function matchesGenre(ev){

  if(genreSel==="All"){
    return true;
  }

  if(genreSel==="Not listed"){
    return !ev.category;
  }

  return (ev.category||"")
    .split(", ")
    .includes(genreSel);
}


function customRangeError(){

  if(dateSel!=="custom"){
    return null;
  }

  if(customFrom && customTo && customTo<customFrom){
    return "End date can't be before the start date.";
  }

  if(customTo && customTo<TODAY_ISO){
    return "That date range is in the past.";
  }

  return null;
}


function matchesDate(ev){

  if(!dateSel){
    return true;
  }

  const start=ev.date;
  const end=ev.end_date||ev.date;

  let from,to;

  if(dateSel==="today"){
    from=to=TODAY_ISO;
  }

  else if(dateSel==="tomorrow"){
    from=to=TOMORROW_ISO;
  }

  else if(dateSel==="weekend"){
    const w=weekendRange(TODAY_ISO);
    from=w.from;
    to=w.to;
  }

  else if(dateSel==="custom"){

    if(!customFrom && !customTo){
      return true;
    }

    from=customFrom||"0000-01-01";
    to=customTo||"9999-12-31";
  }

  return start<=to && end>=from;
}


function render(gen){

  const list=document.getElementById("list");

  list.textContent="";

  const errBox=document.getElementById("dateError");

  const rangeErr=customRangeError();

  errBox.hidden=!rangeErr;

  if(rangeErr){
    errBox.textContent=rangeErr;
  }

  const q=query.trim().toLowerCase();

  const shown=rangeErr
    ? []
    : EVENTS.filter(e=>
        (countySel==="All"||e.county===countySel) &&
        (locationSel==="All"||locationLabel(e)===locationSel) &&
        matchesGenre(e) &&
        matchesDate(e) &&
        matchesShape(e) &&
        (!q || 
          (e.title || "").toLowerCase().includes(q) || 
          (e.venue || "").toLowerCase().includes(q) || 
          (e.category || "").toLowerCase().includes(q)
        )
      );

  // Complete your remaining card rendering loops here using the filtered "shown" array
}
</script>
</body>
</html>
