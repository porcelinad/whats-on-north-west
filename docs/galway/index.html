<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1E2B26">
<title>Out and About Galway</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="../outandabout_logo.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

<style>
  :root{
    --mist:#ECEFE9;
    --ink:#1E2B26;
    --ink-soft:#8b978f; /* Lightened from landing page for clear dark mode reading */
    --ember:#B8481C;
    --heather:#A795C7; /* Adjusted slightly lighter for high contrast against cards */
    --line:#34413b; /* Darkened to blend smoothly with background */
    --stub:#FFFFFF;

    --display:"Barlow Condensed",sans-serif;
    --body:"Atkinson Hyperlegible",system-ui,sans-serif;
  }

  *{
    box-sizing:border-box;
    margin:0;
  }

  body{
    background:var(--ink); /* Flipped background to dark */
    color:var(--mist); /* Flipped default text to light */
    font-family:var(--body);
    font-size:16px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }

  a{
    color:inherit;
  }

  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:0 14px 80px;
  }

  header{
    padding:22px 0 10px;
    border-bottom:3px solid var(--line);
  }

  h1{
    font-family:var(--display); /* Applied matching display typography */
    font-weight:700;
    font-size:clamp(28px,8vw,48px);
    text-transform:uppercase;
    line-height:.95;
    letter-spacing:.02em;
  }

  /* Full-width dynamic black bar style */
  h1 .black-bg{
    background-color: #000;
    display: block;
    width: 100%;
    padding: 0.2em 0.3em;
    margin-bottom: 6px;
  }

  h1 .white{
    color:var(--mist);
  }

  h1 .rust{
    color:var(--ember);
  }

  h1 .region{
    display:block;
    font-size:.62em;
    margin-top:4px;
  }

  .updated{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:6px;
  }

  .controls{
    position:sticky;
    top:0;
    background:var(--ink); /* Swapped to dark to match body background */
    z-index:5;
    padding:10px 0 12px;
    border-bottom:1px solid var(--line);
  }

  .date-filters{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:8px;
    scrollbar-width:none;
    justify-content:center;
  }

  .date-filters::-webkit-scrollbar{
    display:none;
  }

  .extra-filters{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-bottom:8px;
  }

  .chip{
    font-family:var(--display);
    font-weight:600;
    font-size:14px;
    text-transform:uppercase;
    letter-spacing:.04em;
    white-space:nowrap;
    border:1.5px solid var(--mist); /* Inverted border to clean light tone */
    border-radius:999px;
    background:transparent;
    color:var(--mist); /* Text updated to match new layout frame */
    padding:6px 14px;
    cursor:pointer;
    flex:0 0 auto;
    transition:background .15s,color .15s;
  }

  .chip[aria-pressed="true"]{
    background:var(--ember);
    border-color:var(--ember);
    color:#fff;
  }

  .custom-dates{
    display:flex;
    gap:8px;
    margin-bottom:8px;
  }

  .custom-dates[hidden]{
    display:none;
  }

  .custom-dates input[type="date"]{
    font:inherit;
    font-size:14px;
    flex:1 1 0;
    min-width:0;
    border:1.5px solid var(--line);
    border-radius:8px;
    padding:6px 10px;
    background:var(--stub);
    color:var(--ink);
  }

  .date-error{
    font-size:13px;
    color:var(--ember);
    font-weight:700;
    margin:-4px 0 8px;
  }

  .filters{
    display:flex;
    gap:8px;
    margin-bottom:8px;
    flex-wrap:wrap;
  }

  .filter-select{
    font-family:var(--display);
    font-weight:600;
    font-size:14px;
    text-transform:uppercase;
    letter-spacing:.04em;
    border:1.5px solid var(--line);
    border-radius:8px;
    background:var(--stub);
    color:var(--ink);
    padding:7px 26px 7px 12px;
    cursor:pointer;
    flex:1 1 0;
    min-width:90px;
    -webkit-appearance:none;
    appearance:none;
    /* Clean fallback asset definition using exact hex configuration */
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M0 0L5 6L10 0Z" fill="%231E2B26"/></svg>');
    background-repeat:no-repeat;
    background-position:right 10px center;
  }

  .filter-select:focus{
    outline:2px solid var(--ember);
    outline-offset:1px;
  }

  .search-row{
    display:flex;
    gap:8px;
    margin-bottom:10px;
  }

  .clear-btn{
    font-family:var(--display);
    font-weight:700;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:.04em;
    white-space:nowrap;
    border:1.5px solid var(--ember);
    border-radius:8px;
    background:var(--ember);
    color:#fff;
    padding:0 14px;
    cursor:pointer;
    flex:0 0 auto;
  }

  .clear-btn:active{
    opacity:.85;
  }

  #search{
    padding:9px 12px;
    font:inherit;
    font-size:15px;
    flex:1;
    min-width:0;
    border:1.5px solid var(--line);
    border-radius:8px;
    background:var(--stub);
    color:var(--ink);
  }

  #search:focus{
    outline:2px solid var(--ember);
    outline-offset:1px;
  }

  .month{
    font-family:var(--display);
    font-weight:700;
    font-size:22px;
    text-transform:uppercase;
    letter-spacing:.12em;
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    gap:12px;
    margin:26px 0 10px;
  }

  .month::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line);
  }

  .event{
    display:flex;
    gap:0;
    background:var(--stub);
    border-radius:10px;
    margin-bottom:10px;
    overflow:hidden;
    text-decoration:none;
    border:1px solid var(--line);
    color:var(--ink); /* Keeps event info typography bound nicely over light card background */
  }

  .event:active{
    transform:scale(.995);
  }

  .stub{
    flex:0 0 74px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:12px 6px;
    border-right:2px dashed var(--line);
    position:relative;
    font-family:var(--display);
    text-transform:uppercase;
    text-align:center;
  }

  .stub::before,
  .stub::after{
    content:"";
    position:absolute;
    right:-7px;
    width:14px;
    height:14px;
    border-radius:50%;
    background:var(--ink); /* Swapped circle cuts to match new dark background */
    border:1px solid var(--line);
  }

  .stub::before{
    top:-8px;
  }

  .stub::after{
    bottom:-8px;
  }

  .dow{
    font-size:13px;
    font-weight:600;
    letter-spacing:.15em;
    color:var(--ink-soft);
  }

  .day{
    font-size:30px;
    font-weight:700;
    line-height:1;
    margin:2px 0;
  }

  .range{
    font-size:11px;
    color:var(--ink-soft);
    letter-spacing:.05em;
  }

  .info{
    padding:12px 14px;
    min-width:0;
    flex:1;
  }

  .title{
    font-weight:700;
    font-size:16.5px;
    line-height:1.25;
  }

  .meta{
    font-size:13.5px;
    color:var(--ink-soft);
    margin-top:4px;
  }

  .meta b{
    font-weight:700;
    color:var(--ink);
  }

  .tags{
    margin-top:6px;
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    align-items:center;
  }

  .tag{
    font-size:11.5px;
    letter-spacing:.04em;
    color:var(--heather);
    border:1px solid currentColor;
    border-radius:4px;
    padding:1px 6px;
  }

  .new,
  .sold-out{
    font-family:var(--display);
    font-weight:700;
    font-size:12px;
    letter-spacing:.1em;
    background:var(--ember);
    color:#fff;
    border-radius:4px;
    padding:2px 7px;
    text-transform:uppercase;
  }

  .event.sold{
    opacity:.55;
  }

  .event.sold .title{
    text-decoration:line-through;
    text-decoration-color:var(--ink-soft);
  }

  .empty,
  .error{
    padding:40px 10px;
    text-align:center;
    color:var(--ink-soft);
  }

  .warn{
    display:block;
    margin-top:10px;
    padding:8px 12px;
    font-size:14px;
    font-weight:700;
    color:#fff;
    background:var(--ember);
    border-radius:6px;
  }

  footer{
    margin-top:34px;
    font-size:12.5px;
    color:var(--ink-soft);
    border-top:1px solid var(--line);
    padding-top:12px;
  }

  @media (prefers-reduced-motion: reduce){
    *{
      transition:none!important;
    }
  }
</style>
</head>

<body>

<div class="wrap">

  <header>
    <h1>
      <span class="black-bg">
        <span class="white">OUT</span>
        <span class="rust">AND AB</span><span class="white">OUT</span>
      </span>
      <span class="white region">GALWAY</span>
    </h1>

    <p class="updated" id="updated">Loading…</p>
  </header>

  <div class="controls">

    <div class="filters">
      <select id="countyFilter"
              class="filter-select"
              aria-label="Filter by county"></select>

      <select id="locationFilter"
              class="filter-select"
              aria-label="Filter by location"></select>

      <select id="genreFilter"
              class="filter-select"
              aria-label="Filter by genre"></select>
    </div>

    <div class="search-row">
      <input
        id="search"
        type="search"
        placeholder="Search by event, venue or genre…"
        aria-label="Search by event, venue or genre">

      <button
        id="clearFilters"
        class="clear-btn"
        type="button">
        Clear all filters
      </button>
    </div>

    <div
      class="date-filters"
      id="dateFilters"
      role="group"
      aria-label="Filter by date"></div>

    <div
      class="custom-dates"
      id="customDates"
      hidden>

      <input
        type="date"
        id="dateFrom"
        aria-label="From date">

      <input
        type="date"
        id="dateTo"
        aria-label="To date">
    </div>

    <p
      class="date-error"
      id="dateError"
      hidden></p>

    <div
      class="extra-filters"
      id="shapeFilters"
      role="group"
      aria-label="Filter by recurrence"></div>

  </div>

  <main id="list"></main>

  <footer>
    Pulled daily from each venue's own website. Tap an event for details
    and booking on the venue's site.
  </footer>

</div>

<script>

const MONTHS=[
  "January","February","March","April","May","June",
  "July","August","September","October","November","December"
];

const DOWS=[
  "Sun","Mon","Tue","Wed","Thu","Fri","Sat"
];

let EVENTS=[];
let countySel="All";
let genreSel="All";
let locationSel="All";
let query="";
let dateSel=null;
let customFrom="";
let customTo="";
let shapeSel=null;


function normalizeTown(t){
  return t==="Donegal" ? "Donegal Town" : t;
}


function locationLabel(ev){
  return ev.town
    ? normalizeTown(ev.town)
    : (ev.county ? "No town listed" : null);
}


function addDays(iso,n){
  const [y,m,d]=iso.split("-").map(Number);
  return new Date(
    Date.UTC(y,m-1,d+n)
  ).toISOString().slice(0,10);
}


function weekdayOf(iso){
  const [y,m,d]=iso.split("-").map(Number);
  return new Date(
    Date.UTC(y,m-1,d)
  ).getUTCDay();
}


function todayISO(){
  const parts=new Intl.DateTimeFormat(
    "en-CA",
    {
      timeZone:"Europe/Dublin",
      year:"numeric",
      month:"2-digit",
      day:"2-digit"
    }
  ).formatToParts(new Date());

  const get=t=>parts.find(
    p=>p.type===t
  ).value;

  return `${get("year")}-${get("month")}-${get("day")}`;
}


function weekendRange(today){
  const wd=weekdayOf(today);

  if(wd===6){
    return {
      from:today,
      to:addDays(today,1)
    };
  }

  if(wd===0){
    return {
      from:today,
      to:today
    };
  }

  const sat=addDays(today,6-wd);

  return {
    from:sat,
    to:addDays(sat,1)
  };
}


const TODAY_ISO=todayISO();
const TOMORROW_ISO=addDays(TODAY_ISO,1);


const el=(t,c,txt)=>{
  const n=document.createElement(t);

  if(c){
    n.className=c;
  }

  if(txt!==undefined){
    n.textContent=txt;
  }

  return n;
};


function fmt(iso){
  const d=new Date(iso+"T12:00:00");

  return {
    dow:DOWS[d.getDay()],
    day:d.getDate(),
    mon:MONTHS[d.getMonth()].slice(0,3),
    month:MONTHS[d.getMonth()],
    key:iso.slice(0,7)
  };
}


function isNew(ev,gen){
  const first=new Date(ev.first_seen);
  const g=new Date(gen);

  return (g-first)/86400000 <= 7;
}


function fmtUpdated(iso){
  try{
    const d=new Date(iso);

    if(isNaN(d)){
      return iso;
    }

    return d.toLocaleString(
      "en-IE",
      {
        day:"numeric",
        month:"short",
        hour:"2-digit",
        minute:"2-digit",
        timeZone:"Europe/Dublin"
      }
    );

  }catch(e){
    return iso;
  }
}


function matchesShape(ev){

  if(shapeSel==="single"){
    return !ev.end_date;
  }

  if(shapeSel==="recurring"){
    return !!ev.end_date;
  }

  return true;
}


function matchesGenre(ev){

  if(genreSel==="All"){
    return true;
  }

  if(genreSel==="Not listed"){
    return !ev.category;
  }

  return (ev.category||"")
    .split(", ")
    .includes(genreSel);
}


function customRangeError(){

  if(dateSel!=="custom"){
    return null;
  }

  if(customFrom && customTo && customTo<customFrom){
    return "End date can't be before the start date.";
  }

  if(customTo && customTo<TODAY_ISO){
    return "That date range is in the past.";
  }

  return null;
}


function matchesDate(ev){

  if(!dateSel){
    return true;
  }

  const start=ev.date;
  const end=ev.end_date||ev.date;

  let from,to;

  if(dateSel==="today"){
    from=to=TODAY_ISO;
  }

  else if(dateSel==="tomorrow"){
    from=to=TOMORROW_ISO;
  }

  else if(dateSel==="weekend"){
    const w=weekendRange(TODAY_ISO);
    from=w.from;
    to=w.to;
  }

  else if(dateSel==="custom"){

    if(!customFrom && !customTo){
      return true;
    }

    from=customFrom||"0000-01-01";
    to=customTo||"9999-12-31";
  }

  return start<=to && end>=from;
}


function render(gen){

  const list=document.getElementById("list");

  list.textContent="";

  const errBox=document.getElementById("dateError");

  const rangeErr=customRangeError();

  errBox.hidden=!rangeErr;

  if(rangeErr){
    errBox.textContent=rangeErr;
  }

  const q=query.trim().toLowerCase();

  const shown=rangeErr
    ? []
    : EVENTS.filter(e=>
        (countySel==="All"||e.county===countySel) &&
        (locationSel==="All"||locationLabel(e)===locationSel) &&
        matchesGenre(e) &&
        matchesDate(e) &&
        matchesShape(e) &&
        (!q ||
          (e.title||"").toLowerCase().includes(q) ||
          (e.venue||"").toLowerCase().includes(q) ||
          (locationLabel(e)||"").toLowerCase().includes(q) ||
          (e.category||"").toLowerCase().includes(q)
        )
      );

  if(!EVENTS.length){
    list.appendChild(el("div","empty","No events loaded."));
    return;
  }

  if(!shown.length){
    list.appendChild(el("div","empty","No matching events found."));
    return;
  }

  let currentMonthKey=null;

  shown.forEach(ev=>{
    const f=fmt(ev.date);

    if(f.key!==currentMonthKey){
      currentMonthKey=f.key;
      list.appendChild(
        el("div","month",`${f.month} ${f.key.slice(0,4)}`)
      );
    }

    const a=el("a","event");
    a.href=ev.url;
    a.target="_blank";
    a.rel="noopener";

    if(ev.sold_out){
      a.classList.add("sold");
    }

    const stub=el("div","stub");
    stub.appendChild(el("div","dow",f.dow));
    stub.appendChild(el("div","day",f.day));

    if(ev.end_date){
      stub.appendChild(el("div","range","Run"));
    }

    a.appendChild(stub);

    const info=el("div","info");
    info.appendChild(el("div","title",ev.title));

    const meta=el("div","meta");
    const v=el("b",undefined,ev.venue);
    meta.appendChild(v);

    const loc=locationLabel(ev);
    if(loc){
      meta.appendChild(document.createTextNode(` · ${loc}`));
    }

    info.appendChild(meta);

    const tags=el("div","tags");

    if(isNew(ev,gen)){
      tags.appendChild(el("span","new","New"));
    }

    if(ev.sold_out){
      tags.appendChild(el("span","sold-out","Sold Out"));
    }

    if(ev.category){
      ev.category.split(", ").forEach(cat=>{
        tags.appendChild(el("span","tag",cat));
      });
    }

    if(tags.children.length){
      info.appendChild(tags);
    }

    a.appendChild(info);
    list.appendChild(a);
  });
}


function buildSelect(id,options,activeSel,onChange){
  const select=document.getElementById(id);
  select.textContent="";

  options.forEach(opt=>{
    const o=document.createElement("option");
    o.value=opt;
    o.textContent=opt;
    o.selected=(opt===activeSel);
    select.appendChild(o);
  });

  select.onchange=e=>{
    onChange(e.target.value);
  };
}


function updateFilters(){
  const counties=new Set(["All"]);
  const locations=new Set(["All"]);
  const genres=new Set(["All"]);

  EVENTS.forEach(e=>{
    if(e.county) counties.add(e.county);
    const loc=locationLabel(e);
    if(loc) locations.add(loc);
    if(e.category){
      e.category.split(", ").forEach(g=>genres.add(g));
    }
  });

  const sortedCounties=Array.from(counties).sort();
  const sortedLocations=Array.from(locations).sort();
  const sortedGenres=Array.from(genres).sort();

  if(!sortedCounties.includes(countySel)) countySel="All";
  if(!sortedLocations.includes(locationSel)) locationSel="All";
  if(!sortedGenres.includes(genreSel)) genreSel="All";

  buildSelect("countyFilter",sortedCounties,countySel,val=>{
    countySel=val;
    updateFilters();
  });

  buildSelect("locationFilter",sortedLocations,locationSel,val=>{
    locationSel=val;
    render();
  });

  buildSelect("genreFilter",sortedGenres,genreSel,val=>{
    genreSel=val;
    render();
  });

  render();
}


function renderDateFilters(){
  const container=document.getElementById("dateFilters");
  container.textContent="";

  const opts=[
    {id:null,label:"All Dates"},
    {id:"today",label:"Today"},
    {id:"tomorrow",label:"Tomorrow"},
    {id:"weekend",label:"This Weekend"},
    {id:"custom",label:"Custom…"}
  ];

  opts.forEach(o=>{
    const btn=el("button","chip",o.label);
    btn.type="button";
    btn.setAttribute("aria-pressed",dateSel===o.id?"true":"false");

    btn.onclick=()=>{
      dateSel=o.id;
      document.getElementById("customDates").hidden=(dateSel!=="custom");
      renderDateFilters();
    };

    container.appendChild(btn);
  });

  render();
}


function renderShapeFilters(){
  const container=document.getElementById("shapeFilters");
  container.textContent="";

  const opts=[
    {id:null,label:"All Shows"},
    {id:"single",label:"Single Dates"},
    {id:"recurring",label:"Runs / Festivals"}
  ];

  opts.forEach(o=>{
    const btn=el("button","chip",o.label);
    btn.type="button";
    btn.setAttribute("aria-pressed",shapeSel===o.id?"true":"false");

    btn.onclick=()=>{
      shapeSel=o.id;
      renderShapeFilters();
    };

    container.appendChild(btn);
  });

  render();
}


document.getElementById("search").oninput=e=>{
  query=e.target.value;
  render();
};


document.getElementById("dateFrom").onchange=e=>{
  customFrom=e.target.value;
  render();
};


document.getElementById("dateTo").onchange=e=>{
  customTo=e.target.value;
  render();
};


document.getElementById("clearFilters").onclick=()=>{
  countySel="All";
  locationSel="All";
  genreSel="All";
  query="";
  dateSel=null;
  customFrom="";
  customTo="";
  shapeSel=null;

  document.getElementById("search").value="";
  document.getElementById("dateFrom").value="";
  document.getElementById("dateTo").value="";
  document.getElementById("customDates").hidden=true;

  updateFilters();
  renderDateFilters();
  renderShapeFilters();
};


async function init(){
  const uEl=document.getElementById("updated");

  try{
    // CHANGE THIS LINE FROM: fetch("data.json");
    const res=await fetch("../data.json"); 
    if(!res.ok) throw new Error("Network response error");

    const data=await res.json();
    EVENTS=data.events||[];

    uEl.textContent=`Last updated: ${fmtUpdated(data.generated)}`;
    updateFilters();
    renderDateFilters();
    renderShapeFilters();

  }catch(e){
    uEl.textContent="Failed to load events data.";
    const list=document.getElementById("list");
    list.appendChild(el("div","error","Could not load the schedule. Please refresh."));
  }
}

init();

</script>
</body>
</html>
