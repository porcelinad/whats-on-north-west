<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1E2B26">
<title>Out and About North West</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="../outandabout_logo.svg" type="image/svg+xml">

<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

<style>
  :root{
    --mist:#ECEFE9;
    --ink:#1E2B26;
    --ink-soft:#8b978f; /* Lightened from landing page for clear dark mode reading */
    --ember:#B8481C;
    --heather:#A795C7; /* Adjusted slightly lighter for high contrast against cards */
    --line:#34413b; /* Darkened to blend smoothly with background */
    --stub:#FFFFFF;

    --display:"Barlow Condensed",sans-serif;
    --body:"Atkinson Hyperlegible",system-ui,sans-serif;
  }

  *{
    box-sizing:border-box;
    margin:0;
  }

  body{
    background:var(--ink); /* Flipped background to dark */
    color:var(--mist); /* Flipped default text to light */
    font-family:var(--body);
    font-size:16px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }

  a{
    color:inherit;
  }

  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:0 14px 80px;
  }

  header{
    padding:22px 0 10px;
    border-bottom:3px solid var(--line);
  }

  h1{
    font-family:var(--display); /* Applied matching display typography */
    font-weight:700;
    font-size:clamp(28px,8vw,48px);
    text-transform:uppercase;
    line-height:.95;
    letter-spacing:.02em;
  }

  /* Full-width dynamic black bar style */
  h1 .black-bg{
    background-color: #000;
    display: block;
    width: 100%;
    padding: 0.2em 0.3em;
    margin-bottom: 6px;
  }

  h1 .white{
    color:var(--mist);
  }

  h1 .rust{
    color:var(--ember);
  }

  h1 .region{
    display:block;
    font-size:.62em;
    margin-top:4px;
  }

  .updated{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:6px;
  }

  .controls{
    position:sticky;
    top:0;
    background:var(--ink); /* Swapped to dark to match body background */
    z-index:5;
    padding:10px 0 12px;
    border-bottom:1px solid var(--line);
  }

  .date-filters{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:8px;
    scrollbar-width:none;
    justify-content:center;
  }

  .date-filters::-webkit-scrollbar{
    display:none;
  }

  .extra-filters{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-bottom:8px;
  }

  .chip{
    font-family:var(--display);
    font-weight:600;
    font-size:14px;
    text-transform:uppercase;
    letter-spacing:.04em;
    white-space:nowrap;
    border:1.5px solid var(--mist); /* Inverted border to clean light tone */
    border-radius:999px;
    background:transparent;
    color:var(--mist); /* Text updated to match new layout frame */
    padding:6px 14px;
    cursor:pointer;
    flex:0 0 auto;
    transition:background .15s,color .15s;
  }

  .chip[aria-pressed="true"]{
    background:var(--ember);
    border-color:var(--ember);
    color:#fff;
  }

  .custom-dates{
    display:flex;
    gap:8px;
    margin-bottom:8px;
  }

  .custom-dates[hidden]{
    display:none;
  }

  .custom-dates input[type="date"]{
    font:inherit;
    font-size:14px;
    flex:1 1 0;
    min-width:0;
    border:1.5px solid var(--line);
    border-radius:8px;
    padding:6px 10px;
    background:var(--stub);
    color:var(--ink);
  }

  .date-error{
    font-size:13px;
    color:var(--ember);
    font-weight:700;
    margin:-4px 0 8px;
  }

  .filters{
    display:flex;
    gap:8px;
    margin-bottom:8px;
    flex-wrap:wrap;
  }

  .filter-select{
    font-family:var(--display);
    font-weight:600;
    font-size:14px;
    text-transform:uppercase;
    letter-spacing:.04em;
    border:1.5px solid var(--line);
    border-radius:8px;
    background:var(--stub);
    color:var(--ink);
    padding:7px 26px 7px 12px;
    cursor:pointer;
    flex:1 1 0;
    min-width:90px;
    -webkit-appearance:none;
    appearance:none;
    /* Clean fallback asset definition using exact hex configuration */
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://w3.org" width="10" height="6"><path d="M0 0L5 6L10 0Z" fill="%231E2B26"/></svg>');
    background-repeat:no-repeat;
    background-position:right 10px center;
  }

  .filter-select:focus{
    outline:2px solid var(--ember);
    outline-offset:1px;
  }

  .search-row{
    display:flex;
    gap:8px;
    margin-bottom:10px;
  }

  .clear-btn{
    font-family:var(--display);
    font-weight:700;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:.04em;
    white-space:nowrap;
    border:1.5px solid var(--ember);
    border-radius:8px;
    background:var(--ember);
    color:#fff;
    padding:0 14px;
    cursor:pointer;
    flex:0 0 auto;
  }

  .clear-btn:active{
    opacity:.85;
  }

  #search{
    padding:9px 12px;
    font:inherit;
    font-size:15px;
    flex:1;
    min-width:0;
    border:1.5px solid var(--line);
    border-radius:8px;
    background:var(--stub);
    color:var(--ink);
  }

  #search:focus{
    outline:2px solid var(--ember);
    outline-offset:1px;
  }

  .month{
    font-family:var(--display);
    font-weight:700;
    font-size:22px;
    text-transform:uppercase;
    letter-spacing:.12em;
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    gap:12px;
    margin:26px 0 10px;
  }

  .month::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line);
  }

  .event{
    display:flex;
    gap:0;
    background:var(--stub);
    border-radius:10px;
    margin-bottom:10px;
    overflow:hidden;
    text-decoration:none;
    border:1px solid var(--line);
    color:var(--ink); /* Keeps event info typography bound nicely over light card background */
  }

  .event:active{
    transform:scale(.995);
  }

  .stub{
    flex:0 0 74px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:12px 6px;
    border-right:2px dashed var(--line);
    position:relative;
    font-family:var(--display);
    text-transform:uppercase;
    text-align:center;
  }

  .stub::before,
  .stub::after{
    content:"";
    position:absolute;
    right:-7px;
    width:14px;
    height:14px;
    border-radius:50%;
    background:var(--ink); /* Swapped circle cuts to match new dark background */
    border:1px solid var(--line);
  }

  .stub::before{
    top:-8px;
  }

  .stub::after{
    bottom:-8px;
  }

  .dow{
    font-size:13px;
    font-weight:600;
    letter-spacing:.15em;
    color:var(--ink-soft);
  }

  .day{
    font-size:30px;
    font-weight:700;
    line-height:1;
    margin:2px 0;
  }

  .range{
    font-size:11px;
    color:var(--ink-soft);
    letter-spacing:.05em;
  }

  .info{
    padding:12px 14px;
    min-width:0;
    flex:1;
  }

  .title{
    font-weight:700;
    font-size:16.5px;
    line-height:1.25;
  }

  .meta{
    font-size:13.5px;
    color:var(--ink-soft);
    margin-top:4px;
  }

  .meta b{
    font-weight:700;
    color:var(--ink);
  }

  .tags{
    margin-top:6px;
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    align-items:center;
  }

  .tag{
    font-size:11.5px;
    letter-spacing:.04em;
    color:var(--heather);
    border:1px solid currentColor;
    border-radius:4px;
    padding:1px 6px;
  }

  .new,
  .sold-out{
    font-family:var(--display);
    font-weight:700;
    font-size:12px;
    letter-spacing:.1em;
    background:var(--ember);
    color:#fff;
    border-radius:4px;
    padding:2px 7px;
    text-transform:uppercase;
  }

  .event.sold{
    opacity:.55;
  }

  .event.sold .title{
    text-decoration:line-through;
    text-decoration-color:var(--ink-soft);
  }

  .empty,
  .error{
    padding:40px 10px;
    text-align:center;
    color:var(--ink-soft);
  }

  .warn{
    display:block;
    margin-top:10px;
    padding:8px 12px;
    font-size:14px;
    font-weight:700;
    color:#fff;
    background:var(--ember);
    border-radius:6px;
  }

  footer{
    margin-top:34px;
    font-size:12.5px;
    color:var(--ink-soft);
    border-top:1px solid var(--line);
    padding-top:12px;
  }

  @media (prefers-reduced-motion: reduce){
    *{
      transition:none!important;
    }
  }
</style>
</head>

<body>

<div class="wrap">

  <header>
    <h1>
      <span class="black-bg">
        <span class="white">OUT</span>
        <span class="rust">AND AB</span><span class="white">OUT</span>
      </span>
      <span class="white region">NORTH WEST</span>
    </h1>

    <p class="updated" id="updated">Loading…</p>
  </header>

  <div class="controls">

    <div class="filters">
      <select id="countyFilter"
