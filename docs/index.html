<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Out and About</title>
<link rel="icon" href="outandabout_logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1E2B26; --ink-soft:#5b6b64; --mist:#ECEFE9; --ember:#B8481C;
    --display:'Barlow Condensed',sans-serif; --body:'Atkinson Hyperlegible',sans-serif;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:inherit}
  html,body{height:100%}
  body{
    margin:0; background:var(--ink); color:var(--mist); font-family:var(--body);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100%; padding:32px 20px; text-align:center;
  }
  h1{
    font-family:var(--display); font-weight:700; text-transform:uppercase;
    font-size:clamp(38px,10vw,58px); letter-spacing:.02em; line-height:.95; margin:0 0 8px;
  }
  h1 span{color:var(--ember)}
  p.tag{color:#c7cec9; font-size:16px; margin:0 0 40px; max-width:32ch}
  .cities{display:flex; flex-direction:column; gap:16px; width:100%; max-width:360px}
  .city{
    display:block; background:var(--mist); color:var(--ink); text-decoration:none;
    border-radius:14px; padding:20px 24px; text-align:left; position:relative;
    transition:transform .15s ease;
  }
  .city:active{transform:scale(.98)}
  .city-name{
    font-family:var(--display); font-weight:700; text-transform:uppercase;
    font-size:24px; letter-spacing:.02em;
  }
  .city-sub{font-size:14px; color:var(--ink-soft); margin-top:2px}
  .city.disabled{
    background:transparent; border:2px dashed #45524b; color:#8b978f;
    pointer-events:none;
  }
  .city.disabled .city-name{color:#8b978f}
  .badge{
    position:absolute; top:16px; right:16px; font-size:11px; font-weight:700;
    letter-spacing:.08em; text-transform:uppercase; color:var(--ember);
    background:rgba(184,72,28,.12); padding:4px 10px; border-radius:999px;
  }
  .city.disabled .badge{color:#8b978f; background:rgba(139,151,143,.12)}
</style>
</head>
<body>
  <h1>Out and <span>About</span></h1>
  <p class="tag">Pulled daily from each venue's own website. Pick where you're headed.</p>
  <div class="cities">
    <a class="city" href="https://porcelinad.github.io/whats-on-north-west/nw">
      <div class="city-name">North West</div>
      <div class="city-sub">Donegal · Derry · Sligo · Leitrim · Tyrone · Fermanagh</div>
    </a>
     <div class="cities">
    <a class="city" href="https://porcelinad.github.io/whats-on-north-west/galway">
      <div class="city-name">Galway</div>
      <div class="city-sub">Galway</div>
    </div>
</body>
</html>
